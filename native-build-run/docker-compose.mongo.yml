services:
  mongodb:
    image: mongo:5
    container_name: mongodb
    restart: "no"
    ports:
      - "27017:27017"
    entrypoint: [ "/usr/bin/mongod", "--bind_ip_all", "--replSet", "rs0" ]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 5s
      retries: 5
  
  mongo-init-replica:
    image: mongo:5
    container_name: hospital_mongo_init
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        echo 'Waiting on MongoDB init'
        mongo --host mongodb:27017 --eval '
          var status = rs.status()
          if (status.ok === 1) {
            rs.status();
            print("Replica Set already configured");
          } else {
            rs.initiate({
              _id: "rs0",
              members: [{ _id: 0, host: "mongodb:27017" }]
            });
            print("Replica Set rs0 initialized");
          }
        '
        touch /tmp/init_ready
        tail -f /dev/null
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/init_ready"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  mongo-data: