name: Mutation Testing (Night + Manual)

on:
  schedule:
    -cron: '0 3 * * 1-5'
  workflow_dispatch:

jobs:
  pitest:
    runs-on: ubuntu-latest
    env:
      workdir: hospital-scheduler-aggregator

    name: Build on Linux
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml', '**/*.yml') }}
          restore-keys: ${{ runner.os }}-m2-pitest

      - name: Run Mutation testing with Pitest
        run: mvn clean verify -Pmutation-testing
        working-directory: ${{ env.workdir }}

      - name: Upload Pitest reports
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: pitest-reports
          path: '**/target/pit-reports/**'
