name: Mutation Testing (Night + Manual)

on:
  schedule:
    - cron: '0 3 * * 1-5'
  workflow_dispatch:

jobs:
  pitest:
    runs-on: ubuntu-latest
    env:
      workdir: hospital-scheduler-aggregator

    name: Build on Linux
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml', '**/*.yml') }}
          restore-keys: ${{ runner.os }}-m2-pitest

      - name: Pre-pull testcontainers Docker images
        run: |
          docker pull mariadb:10.3.39
          docker pull mongo:5
          docker pull testcontainers/ryuk:0.12.0

      - name: Install Xvfb and OpenBox
        run: |
          sudo apt-get update && sudo apt-get install -y openbox xvfb

      - name: Run Mutation testing with Pitest
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" bash -c "
          openbox &
          mvn verify -Pmutation-testing-full"
        working-directory: ${{ env.workdir }}

      - name: Upload Pitest reports
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: pitest-reports
          path: '**/target/pit-reports/**'
